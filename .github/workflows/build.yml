name: GunaYala Ride

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  apk-debug:
    name: APK debug (para probar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Preparar google-services.json
        # Orden: 1) el google-services.json del repo, 2) el secreto
        # GOOGLE_SERVICES_JSON, 3) uno de prueba para que el build no se caiga.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -s android/app/google-services.json ]; then
            echo "Usando el google-services.json del repo."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Usando google-services.json del secreto."
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "gunayala-ride-ci",
              "storage_bucket": "gunayala-ride-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.gunayala.ride" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI_PLACEHOLDER_0000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "Sin secreto: google-services.json de prueba."
          fi

      - name: Flutter build apk --debug
        run: flutter build apk --debug --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: gunayala-ride-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Subir el APK a Firebase App Distribution
        # Opcional: si hay credenciales, el APK queda instalado en los
        # telefonos de prueba sin que nadie descargue el archivo a mano.
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_CLI_TOKEN" ]; then
            echo "Sin credenciales de App Distribution: el APK queda como artifact."
            exit 0
          fi
          curl -sSL https://firebase.tools | bash
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk \
            --project gunayala-ride --app "$FIREBASE_APP_ID" --token "$FIREBASE_CLI_TOKEN" \
            --groups testers || echo "App Distribution fallo; el artifact sigue disponible."

  aab-release:
    name: AAB de Play Store (firmado)
    needs: apk-debug
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ¿Hay keystore de release?
        id: keycheck
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "has=$( [ -n "$KEYSTORE_B64" ] && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - name: Armar key.properties
        if: steps.keycheck.outputs.has == 'yes'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/gunayala-release.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gunayala-release.jks
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          PROPS
          echo "Keystore armado."

      - name: ¿Hay google-services.json real?
        id: gsjcheck
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "has=$( [ -n "$GSJ" ] && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - name: Instalar google-services.json
        if: steps.gsjcheck.outputs.has == 'yes'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sin keystore o sin google-services.json
        if: steps.keycheck.outputs.has != 'yes' || steps.gsjcheck.outputs.has != 'yes'
        run: |
          echo "::warning::Falta ANDROID_KEYSTORE_BASE64 o GOOGLE_SERVICES_JSON."
          echo "Se construye el AAB con R8 y firma de debug: sirve para MEDIR el DEX"
          echo "y confirmar que Play lo daria por bueno, pero Play Store lo rechaza"
          echo "hasta que haya keystore de release configurado."

      # El build release SIEMPRE corre: es el unico que activa R8, y si las
      # reglas de proguard estuvieran mal, el release se caeria en el telefono
      # del usuario y no aqui.
      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build appbundle --release
        run: flutter build appbundle --release

      - name: Medir el DEX del bundle
        # Play exige >=25% en optimizacion, ofuscacion y reduccion.
        run: |
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          echo "AAB: $(du -h "$BUNDLE" | cut -f1)"
          echo "base/dex:"
          unzip -p "$BUNDLE" base/dex/classes.dex 2>/dev/null | wc -c | \
            awk '{printf "  classes.dex: %.1f MB\n", $1/1048576}'
          echo "metodos referenciados (marcador de reduccion de R8):"
          unzip -p "$BUNDLE" BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties \
            2>/dev/null || echo "  (sin metadata de dependencias: includeInBundle=false)"

      - uses: actions/upload-artifact@v4
        with:
          name: gunayala-ride-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Subir a Play Store
        if: steps.keycheck.outputs.has == 'yes' && steps.gsjcheck.outputs.has == 'yes'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Sin PLAY_SERVICE_ACCOUNT_JSON: el AAB queda como artifact."
            exit 0
          fi
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          curl -sSL https://firebase.tools | bash
          firebase appdistribution:distribute \
            build/app/outputs/bundle/release/app-release.aab \
            --project gunayala-ride --token "${{ secrets.FIREBASE_CLI_TOKEN }}" \
            --groups testers || echo "App Distribution fallo; el artifact sigue disponible."
          rm -f play-service-account.json

  functions:
    name: Cloud Functions (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json

      - run: npm install --no-audit --no-fund
      - run: npm run build