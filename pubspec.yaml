name: gunayala_ride
description: GunaYala Ride - se vende el cupo, no el trayecto. Chofer publica, pasajero pide cupo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_functions: ^6.0.0
  firebase_messaging: ^16.0.0

  # Ruta, GPS, fotos y contacto
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.0

  # Estado y formato
  provider: ^6.1.2
  intl: ^0.20.0
  # Hash del token de push (users/{uid}/devices/{hash}) y del codigo OTP.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true